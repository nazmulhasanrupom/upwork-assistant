# Coolify / server deploy: no host port is published. Coolify's proxy (Traefik)
# reaches the panel on the exposed container port 8000.
# Laptop: docker compose -f docker-compose.yml -f docker-compose.local.yml up
# Nothing here is required. Blank SECRET_KEY: the app makes its own and keeps it in /data.
# Blank PUBLIC_BASE_URL: the app saves the address of the first page you open.
x-app-env: &app-env
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
  SECRET_KEY: ${SECRET_KEY:-}
  CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  TZ: ${TZ:-UTC}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATA_DIR: ${DATA_DIR:-/data}
  CLAUDE_CONFIG_DIR: ${CLAUDE_CONFIG_DIR:-/data/claude}

services:
  panel:
    build: .
    image: upwork-assistant:local
    command: ["uvicorn", "app.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    environment: *app-env
    expose:
      - "8000"
    volumes:
      - data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  scheduler:
    image: upwork-assistant:local
    command: ["supercronic", "/app/config/crontab"]
    init: true  # reaps finished task processes the scheduler started (they outlive its tick)
    environment: *app-env
    volumes:
      - data:/data
    depends_on:
      - panel
    restart: unless-stopped

volumes:
  data:
