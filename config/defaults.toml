# Default settings. The `settings` table in SQLite overrides these.
# Keys are addressed as "<section>.<name>", for example "pay.good_spending".

[general]
dry_run = true            # SPEC 14: nothing is sent to Upwork while true
kill_switch = false       # stops all tasks at once
timezone = "UTC"

[pay]                     # SPEC 8.2, 8.3
good_spending = 5000      # min client total spent (USD)
low_rate_max = 10         # rate_paid <= this is LOW
mid_rate_min = 11
mid_rate_max = 20
high_rate_min = 21
hourly_budget_min = 11    # hourly job budget max must be >= this
fixed_budget_min = 300    # fixed job budget min (USD)
low_rate_high_hires = 100 # "total_hires is high" for the LOW rule
fit_min = 65              # SPEC 8.5: min fit score to go to the writing model

[flags]                   # SPEC 8.4
feedback_min = 4.5
feedback_min_reviews = 3
bad_review_score_max = 2  # a review with score <= this is a flag
hire_rate_min = 40
bad_proposals_tier = "50+"

[search]                  # SPEC 8.1
keywords = []             # built from the profile skills in the wizard
recent_days_posted = 1
verified_payment_only = true
best_match_limit = 20     # jobs asked per smart_search best_match call
recent_limit = 20         # jobs asked per smart_search most_recent call
keyword_limit = 10        # jobs asked per keyword search call
max_keywords = 10         # at most this many keyword searches per run
description_max_chars = 3000   # job text sent on to Claude is cut to this
review_comment_chars = 200     # client review comments are cut to this
max_reviews = 5                # latest client reviews kept per job

[daily]                   # SPEC 6.2, 9.1
top_skills = 10                 # skills listed in the daily note

[ui]
jobs_page_size = 50             # cards per page on /jobs
runs_page_size = 25             # rows per page on /runs
log_match_minutes = 10          # a run's log file starts at most this long before the run row
log_view_max_kb = 256           # the log viewer shows at most the last part of a file this big
hide_unaffordable = false       # /jobs hides jobs that cost more Connects than the latest balance
funnel_weeks = 8                # weeks shown in the dashboard funnel chart
rank_chart_days = 30            # days shown in each keyword rank chart

[memory]                  # SPEC2 5.1, plan J2a
total_cap_chars = 3500          # MEMORY.md + USER.md together; over this the page warns
user_build_max_chars = 2500     # USER.md length asked for when built from the Upwork profile
input_max_chars = 20000         # biggest text the Profile page accepts per box
build_profile_max_chars = 12000 # profile text sent to Claude is cut to this
build_max_turns = 4
build_max_budget_usd = 0.30

[review]                  # SPEC2 4.B, plan R (proposal reviewer)
length_warn_chars = 1800        # a longer cover letter gets a warning
length_max_chars = 5000         # Upwork's hard maximum for a cover letter
first_lines_max_chars = 260     # the first 2 lines are the part the client sees first
first_lines_min_chars = 40      # shorter than this: note only
input_max_chars = 20000         # biggest text the form accepts per box
timeout_seconds = 300            # one review call may run this long
job_text_max_chars = 12000      # pasted job text is cut to this before it goes to Claude
job_list_limit = 60             # recent jobs offered in the job picker
history_limit = 30              # past reviews listed on /review
score_good = 80                 # score badge: this or more is green
score_ok = 60                   # score badge: this or more is yellow, below is red
after_send_enabled = true       # daily run syncs my sent proposals and reviews each new one once (plan R3)
after_send_max_age_days = 90    # older proposals are stored but never reviewed
after_send_list_limit = 25      # proposals asked for in the one `list` call (Upwork max is 25)
after_send_max_per_run = 5      # Claude reviews per daily run; the rest wait for the next run
after_send_page_limit = 50      # proposals shown on /review

[metrics]                 # SPEC2 4.C phase 1, plan X1 (daily metrics snapshot)
enabled = true                  # the daily run stores one metrics row per local day
jss_enabled = true              # also try to read my Job Success Score (find_freelancers get_profile)
profile_key = ""                # my profile key (~...), learned from get_profile on the first run
funnel_days = 7                 # proposals sent in the last N days count in the funnel
interview_statuses = ["Offered", "Activated"]   # proposal statuses that count as an interview
hire_statuses = ["Hired"]       # proposal statuses that count as a hire
invite_memory_days = 30         # invitation ids seen in this many past days are not "new" again
average_days = 7                # window of the average helper (used by rank and alerts later)
card_days = 7                   # the dashboard "This week" card sums invites over this many days
profile_views_max = 1000000     # biggest number the profile views box accepts

[profile_versions]        # SPEC2 4.C phase 2, plan O1 (saved copies of my Upwork profile)
daily = true                    # the daily run saves a copy (only when the content changed)
keep = 200                      # newest versions kept (older rows and files are deleted)
diff_max_chars = 20000          # longest text the history page diffs (longer is cut)

[rank]                    # SPEC2 4.C, plan X2 (keyword rank, one check per local day)
enabled = true                  # the daily run checks the rank once a day
run_hour_local = 6              # first daily run at or after this local hour does the check
page_size = 25                  # freelancers per find_freelancers page (Upwork max 25)
max_pages = 4                   # pages looked at per keyword; not found after that = NULL
max_keywords = 20               # at most this many keywords are checked
average_days = 7                # window of the average on the dashboard
max_mcp_calls = 32              # rank's own MCP call budget per run (counted apart from upwork.max_mcp_calls_per_run)
keywords = ["n8n automation", "AI automation", "AI agent developer", "Make.com", "Zapier", "RAG chatbot", "Python automation", "workflow automation"]   # seed list; Phase KW replaces it with the approved ones

[keywords]                # plan KW1 (SPEC2 4.C phase 0): find the 3 to 5 keywords to rank for. Run by hand, never scheduled.
seeds = ["n8n automation", "AI automation", "AI agent developer", "Make.com", "Zapier", "RAG chatbot", "Python automation", "workflow automation"]   # start list; edit it in the settings table
max_seeds = 12                  # at most this many seeds are measured
max_mcp_calls = 60              # this task's own MCP call budget (counted apart from upwork.max_mcp_calls_per_run)
jobs_limit = 5                  # jobs asked per find_jobs search (only the total_matching number is used)
rank_pages = 2                  # freelancer pages read per seed (also gives the total number of freelancers and my place)
min_picks = 3                   # Claude must pick at least this many seeds, else no approval item is made
max_picks = 5                   # Claude's list is cut to this many
reason_max_chars = 200          # a reason is cut to this
pick_max_turns = 4
pick_max_budget_usd = 1.00
pick_timeout_seconds = 600
baseline_days = 14              # after the keywords are approved, no profile change for this many days
baseline_started = ""           # local date (YYYY-MM-DD) the owner approved the keywords; set by the approval, "" = never

[schedules]               # SPEC 9, cron in the configured time zone
daily = "0 */2 * * *"
digest = "0 21 * * *"
weekly = "0 6 * * 1"
monthly = "0 7 1 * *"
profile_test = "30 7 * * *"     # plan O3: checked every day, but a test is only started when profile_loop.every_days have passed
scheduler_interval_minutes = 5
grace_minutes = 30        # a slot missed by more than this is skipped, not replayed (plan I4)

[scheduler.last_due]      # written by the scheduler: the last slot handled per task (UTC, ISO)
daily = ""
digest = ""
weekly = ""
monthly = ""
profile_test = ""

[models]                  # SPEC 4.4, 7.2
think = "claude-opus-5-5"
write = "claude-sonnet-5-5"
fetch = "claude-haiku-5-5"  # cheap model that only relays read-only Upwork tool calls (plan P1)
think_effort = "medium"   # passed only if the CLI supports an effort setting
write_effort = "high"

[claude]                  # SPEC 7.2, 7.3
think_max_turns = 6
think_max_budget_usd = 1.00
write_max_turns = 6
write_max_budget_usd = 0.50
monthly_cap_usd = 50.0
cap_warn_percent = 80           # dashboard and /runs warn when the month's cost reaches this share of the cap
review_max_turns = 6
review_max_budget_usd = 0.50
max_jobs_per_think_call = 5
max_proposals_per_write_call = 3
retry_hours = 48                # jobs still waiting for a judgement or a draft are retried for this long
fetch_max_budget_usd = 0.25     # cap for one Upwork fetch run (plan P1)
fetch_batch_size = 8            # Upwork tool calls per claude run
fetch_timeout_seconds = 300
config_dir = ""                 # CLAUDE_CONFIG_DIR for fetch runs; empty = $CLAUDE_CONFIG_DIR or <data dir>/claude

[upwork]                  # SPEC 5. The mcp_* and oauth_* keys belong to the unused direct client (client.py, oauth.py)
max_mcp_calls_per_run = 40
mcp_calls_per_second = 1
preview_lifetime_minutes = 30   # guess, to be measured on day 1
mcp_url = "https://mcp.upwork.com/mcp"
talent_org_uid = ""             # the freelancer account's org_uid (from list_accounts), set in the wizard
talent_name = ""                # display name of that account (from list_accounts)
talent_candidates = []          # TALENT accounts waiting for the admin to pick one
last_test_status = ""           # result of the last Test connection: ok | needs_login | failed ("" = never)
last_test_at = ""               # when it ran (ISO time, UTC)
last_test_message = ""          # short text shown on /upwork
mcp_protocol_version = "2025-06-18"  # MCP Streamable HTTP; the server may answer with an older one
mcp_timeout_seconds = 30
mcp_max_tries = 3               # tries per request on 429, 5xx, or network errors
mcp_backoff_seconds = 1.0       # wait before try 2; doubles each time (Retry-After wins)
mcp_retry_after_max_seconds = 60  # never wait longer than this, even if Upwork asks
# OAuth (SPEC 3.6). The scope is unknown: empty means the scope parameter is not sent.
oauth_authorize_url = "https://www.upwork.com/ab/account-security/oauth2/authorize"
oauth_token_url = "https://www.upwork.com/api/v3/oauth2/token"
oauth_revoke_url = "https://www.upwork.com/api/v3/oauth2/token/revoke"
oauth_scope = ""
oauth_send_resource = true      # RFC 8707: send resource=<mcp_url> on authorize, token, refresh
oauth_state_minutes = 10        # a login link is valid this long, one use
oauth_refresh_skew_seconds = 60 # refresh this long before the access token ends
oauth_default_expires_in = 3600 # used when the token answer has no expires_in
oauth_timeout_seconds = 15

[alerts]
run_failed_threshold = 3        # SPEC 11: email after this many failed runs in a row
connects_low_min_hours = 24     # max one low-Connects email per this many hours
auth_expired_min_hours = 24     # same for "Upwork login expired"
run_failed_min_hours = 24       # same for "run failed 3 times"
invites_enabled = true          # plan X3: email for a new invite, and once more when it is not answered
invite_reminder_hours = 12      # an invite still waiting after this many hours gets one more email
jss_drop_enabled = true         # email + JSS guard when my Job Success Score drops
jss_drop_points = 1             # a drop of at least this many points counts
rank_drop_enabled = true        # email when a keyword's rank gets worse for several days in a row
rank_drop_positions = 3         # the average place must be worse by at least this many places ...
rank_drop_days = 3              # ... on this many days in a row (7-day average vs the 7 days before)

[writes]                  # plan H1: the write path (app/upwork/writes.py). Preview and confirm need a user click.
preview_max_age_minutes = 25    # a preview older than this must be made again (Upwork keeps it about 30, to be measured)
click_max_age_seconds = 600     # a user click proves one write only if it is this fresh
max_turns = 4                   # one tool call per write run, a few turns for ToolSearch and the answer
max_budget_usd = 0.25           # cap for one write run
timeout_seconds = 300
cover_letter_max_chars = 5000   # Upwork limit; longer is refused, never cut
require_asked_flags = true      # confirm needs "asked about attachments" and "asked about highlights" (Upwork rule)
existing_check_limit = 25       # proposals read when checking for an existing proposal (max 25)
highlights_max_shown = 30       # plan H2: most highlights (portfolio, certificates, past jobs) listed on the job page
answer_max_chars = 5000         # plan H2: longest screening answer the edit form saves (never cut, refused)

[playbook]                # SPEC2 6, plan O2 (tactic playbook and experiments)
test_days = 14                  # a test runs this many days before it is judged
baseline_metrics = ["jss", "invites_new", "proposals_sent", "proposals_viewed", "interviews", "hires"]   # metrics_daily columns saved as the baseline of a test
result_max_chars = 500          # a test result is cut to this
experiments_shown = 20          # most experiments listed on the page

[profile_loop]            # plan O3 (SPEC2 4.C phase 2): the profile test loop. Every change is one user click (D9).
every_days = 14                 # the scheduler starts a new test at most this often
last_run = ""                   # UTC ISO time of the last attempt; written by the task
writable_tactics = [1, 2, 3, 4, 9]   # playbook tactic numbers that the write tools can do (title, overview, skills)
eligible_statuses = ["untested"]     # only tactics with one of these statuses are offered to Opus
allowed_types = ["Ask first", "Auto"]   # playbook Type values that may be tested (Alert and Manual never)
top_keywords = 1                # approved keywords searched for the top profiles (the first ones)
top_n = 10                      # profiles in the competitor summary
max_mcp_calls = 12              # this task's own MCP call budget
title_max_chars = 70            # Upwork title limit; a longer draft is refused, never cut
description_max_chars = 5000    # overview limit
skills_max = 20                 # skill slots
skill_max_chars = 50            # longest skill name
copy_max_words = 5              # a draft that repeats this many words in a row from a competitor title is refused
pick_max_turns = 4
pick_max_budget_usd = 1.00
pick_timeout_seconds = 600
draft_max_turns = 4
draft_max_budget_usd = 0.50
draft_timeout_seconds = 600
reason_max_chars = 300
small_change_max_words = 40     # "Approve all small changes": a change with at most this many added plus removed words
batch_confirms = true           # the batch click also confirms each preview (still blocked by dry-run)
change_pct = 10.0               # judge: a 7-day average must move this many percent to count
jss_drop_points = 3.0           # judge: a JSS drop of this many points is "hurt" at once

[safety]                  # plan HR1/X3: switches the agent may set but never clear
jss_guard = false               # set when the JSS drops; stops Phase O profile tests. Only the owner clears it.
jss_guard_note = ""             # why and when the guard was set

[email]                   # SPEC 11, plan M. Gmail is used when connected, else SMTP when smtp_host is set.
smtp_host = ""            # optional fallback for people without Gmail
smtp_port = 587           # 465 means implicit TLS
smtp_user = ""
smtp_password = ""
smtp_starttls = true
from_address = ""
to_address = ""
gmail_client_id = ""            # Google OAuth client (type Web). Entered on the Email page.
gmail_client_secret_enc = ""    # the client secret, encrypted with SECRET_KEY (never shown again)
gmail_address = ""              # the connected Gmail address (from the id_token)
gmail_recipient = ""            # who gets the emails; empty = the connected address
gmail_scope = "openid email https://www.googleapis.com/auth/gmail.send"
gmail_auth_url = "https://accounts.google.com/o/oauth2/v2/auth"
gmail_token_url = "https://oauth2.googleapis.com/token"
gmail_revoke_url = "https://oauth2.googleapis.com/revoke"
gmail_send_url = "https://gmail.googleapis.com/gmail/v1/users/me/messages/send"
gmail_state_minutes = 10        # a connect link is valid this long, one use
gmail_refresh_skew_seconds = 60 # refresh this long before the access token ends
gmail_timeout_seconds = 20
smtp_timeout_seconds = 20
digest_skip_empty = true        # no daily digest email when no MID/HIGH job was kept today
digest_max_jobs = 15            # jobs listed in the digest email, best fit first

[email.events]            # one switch per email (SPEC 11); all on by default
high_job = true
keywords_ready = true           # the keyword pick waits on /approvals
profile_change_ready = true     # a profile test change waits on /approvals
after_send_review = true
invite = true                   # new invite, right away
invite_reminder = true          # the same invite is still not answered (alerts.invite_reminder_hours)
jss_drop = true
rank_drop = true
message = true
connects_low = true
auth_expired = true
run_failed = true
cannot_do = true
digest = true
weekly = true
monthly = true

[approvals]               # plan H3: the approvals queue (/approvals)
expire_days = 30                # a generic item nobody decided on for this long is marked expired

[inbox]                   # plan H3: invites and messages page (/inbox). Replies are drafted, never sent.
rooms_limit = 10                # chat rooms asked for in one get_messages read
text_max_chars = 2000           # a message is cut to this before it goes to Claude (and is shown)
reply_max_chars = 3000          # a drafted reply is cut to this
reply_max_turns = 4
reply_max_budget_usd = 0.30
reply_timeout_seconds = 300

[security]                # SPEC 10.4
max_login_tries = 5           # wrong tries before the login locks
lockout_minutes = 15
session_hours = 12
password_min_length = 12
