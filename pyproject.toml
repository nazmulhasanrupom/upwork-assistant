[project]
name = "upwork-assistant"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
markers = [
  "judging: run the real judge/write step of the daily task (with a fake claude)",
  "after_send: run the real after-send proposal review of the daily task (with fakes)",
  "metrics: run the real daily metrics snapshot of the daily task (with a fake bridge)",
  "rank: run the real daily keyword rank check of the daily task (with a fake bridge)",
]
