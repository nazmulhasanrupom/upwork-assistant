<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Upwork Assistant{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body{% if csrf_token %} hx-headers='{"X-CSRF-Token": "{{ csrf_token }}"}'{% endif %}>
  <header>
    <strong>Upwork Assistant</strong>
    {% if user %}
    <nav>
      <a href="/">Dashboard</a>
      <a href="/jobs">Jobs</a>
      <a href="/upwork">Upwork</a>
    </nav>
    <form method="post" action="/logout" class="inline">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button type="submit">Log out</button>
    </form>
    {% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer><small>Not made by or linked to Upwork or Anthropic.</small></footer>
</body>
</html>
