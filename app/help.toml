# Text for the "i" icons. Plain words, short sentences. Pattern: "What it is. What to do."
"jobs.score" = "How well this job fits you, 0 to 100. Open jobs above 70 first."
"jobs.activity" = "What the client has done with this job. Potential means interviews started. Good means fresh with few proposals. Suspicious means old with proposals. Unknown means no data. Hidden jobs are dropped."
"approvals.pending" = "Drafts and changes waiting for your click. Nothing is sent until you confirm."
"runs.cost" = "What Claude cost for this run. Check it if the total looks high."
"approvals.proposals" = "Proposals with a ready preview. Approve on the job page, after you see the Connects cost, boost and questions. Old previews drop off."
"approvals.keywords" = "Measures your seed keywords on Upwork, then Claude picks the best 3 to 5. Approving starts a baseline with no profile change."
"approvals.profile_test" = "One profile change at a time, tested for several days. Claude drafts it from your USER.md facts. Nothing changes on Upwork until you confirm the preview."
"approvals.small" = "Small profile changes in one click. Upwork makes a preview of each one. The preview is confirmed right away only when that setting is on."
"approvals.rollback" = "Red is on your profile now, green is the new text. Approve asks Upwork for a preview and saves a copy first. You confirm it on the History page."
"approvals.playbook" = "From the weekly web research. Approve changes the playbook only, nothing on Upwork. Web pages are untrusted, so check the sources."
"approvals.keywords_pick" = "Approve replaces the checked list with these keywords and starts the baseline."
"approvals.no_handler" = "No automatic action is attached to this kind yet. Your decision is only recorded."
"dashboard.todo" = "The newest things that wait for your click. Nothing is sent to Upwork by itself."
"dashboard.best_jobs" = "Today's best-fitting jobs, high fit first. Open one to prepare a proposal."
"dashboard.funnel" = "Proposals by the week they were sent. Viewed means the client saw it. Interviews and hires follow the proposal status."
"dashboard.rank" = "Your place in Upwork freelancer search per keyword. Lower is better; a cross means not found that day."
"dashboard.rank_table" = "Organic skips paid (boosted) results. A dash means no check yet."
"dashboard.weekly" = "A snapshot of your week from Upwork. The daily run stores one each day."
"dashboard.profile_views" = "Upwork shows no number we can read. Look at your profile stats once a week and type it here."
"dashboard.runs" = "The last run of each background task, with a Run now button for each."
"dashboard.connects" = "Connects left on your account. It is read when the daily task fetches a job."
"dashboard.cost" = "What Claude cost this month, against the monthly cap you set."
"dashboard.good_jobs" = "Jobs rated HIGH or MID that appeared since midnight."
"dashboard.waiting" = "Items in the To do list that wait for your click."
"job.fit" = "How Claude rates this job for you, with reasons and risks. Read the risks before you apply."
"job.apply" = "Prepare asks Upwork for a preview and sends nothing. Approve is the only step that can send."
"job.draft" = "Written by Claude from your USER.md facts. Edit it, then Prepare. Em dashes are flagged."
"job.questions" = "Upwork asks if you attach files and which highlights to show. Answer both before you can approve."
"review.intro" = "Paste your draft before you send it. Python checks spelling and spacing for free, then Claude checks the job's instructions, your first lines and proof. Nothing is sent to Upwork."
"review.job" = "Pick a stored job, newest first, or leave empty and paste the job text below."
"review.job_text" = "Paste the whole post, including the screening questions."
"review.answers" = "Optional. Paste each question with your answer."
"review.rate" = "For example 35 (per hour) or your fixed bid. It is compared with the job's budget."
"review.score" = "Out of 100. Above 80 is ready after a last read; fix the issues below first if it is lower."
"review.prechecks" = "Free Python checks for spelling, spacing, length and rate. Fix the red ones first."
"review.diff" = "Removed words are struck through on the left. Added words are underlined on the right."
"review.sent" = "The daily run reads your sent proposals and reviews each new one once. Nothing is changed on Upwork."
"review.history" = "Your earlier reviews, newest first. Open one to see its score and fixes."
"inbox.intro" = "Read-only. Draft reply asks Claude for a draft you copy and post by hand on Upwork. Nothing is sent from here."
"context.intro" = "Claude reads USER.md and style.md on every judging and writing run. Keep them short and true."
"context.rebuild" = "Claude drafts a short USER.md from your Upwork profile. Nothing is saved until you click Use this. It costs a few cents."
"context.user" = "Facts only: title, rate, skills, real projects with numbers, experience, languages, Upwork stats. Shorter is cheaper."
"context.style" = "How you write. Empty or unchanged text uses the default style."
"history.intro" = "A copy of your Upwork profile is saved daily and before any change, only when it changed. Roll back asks for approval first."
"playbook.intro" = "What to try on your profile, one change at a time. Tests are judged with 7-day averages. This page changes nothing on Upwork."
"trends.intro" = "Counted by Python from every job the daily run saw, also dropped ones. No Claude cost. The weekly task reads these numbers."
"trends.skills" = "How often each skill appears in the jobs seen, week by week."
"trends.budget" = "Median budget per week. Fixed price and hourly are kept apart. A week with too few budgets has no point."
"trends.week" = "The last 7 days against the 7 days before, per skill."
"reports.intro" = "The weekly trend report and the monthly plan, newest first. Open one to read it."
"learning.intro" = "Each time the assistant changes its memory, playbook or skills, one entry is saved. Undo adds an entry that reverses it. It never touches Upwork."
"settings.intro" = "Every tunable value, by section. Secrets are never shown here. Email accounts live on the Email page."
"settings.dry_run" = "While on, nothing is sent to Upwork. Every write still needs a preview and your click."
"settings.kill_switch" = "Stops every scheduled task and Claude step. Turn it on if something looks wrong."
"settings.export" = "Downloads your settings and a count of what is stored. No secrets, no tokens, no job text."
"settings.delete" = "Type the phrase and give your password or a current 6 digit code (one of the two). Export first if you want a copy."
"setup.intro" = "Ten short steps. Dry-run stays ON until you turn it off on your own. You can come back to any step."
"setup.admin" = "The admin account and the authenticator app are set."
"setup.admin_account" = "This page only works until the first admin exists. The setup code is printed in the container log."
"setup.totp" = "Scan the QR code with an authenticator app, then enter the 6 digit code. Do not reload after you scan: a reload makes a new key."
"setup.claude" = "Runs a short test call to Claude. A wrong or missing token is shown here, never the token itself."
"setup.upwork" = "Log in to Upwork and pick the freelancer account on the Upwork page."
"setup.profile" = "Build USER.md from your Upwork profile, edit it, and save it on the Profile page."
"setup.keywords" = "One search keyword per line. The daily run searches Upwork for these."
"setup.pay" = "Your pay rules. The defaults are fine to start with."
"setup.style" = "Default: plain English, short sentences, no em dashes. Write your own on the Profile page."
"setup.email" = "Connect Gmail to get the daily digest. You can skip this."
"setup.schedule" = "Cron times in your time zone, for example Europe/Berlin."
"setup.dryrun" = "While dry-run is on, nothing is sent to Upwork. Turn it off later in Settings."
"setup.finish" = "Finish needs every step done except the optional one. Dry-run stays ON."
"upwork.intro" = "Upwork is reached through Claude Code. A small, cheap model makes read-only Upwork calls and the app reads the raw answers."
"upwork.account" = "Only your freelancer (TALENT) account is used. Other account types are ignored."
"upwork.import" = "Log in to Upwork inside Claude Code on your own computer, then upload the login file here. The app keeps only the Upwork part."
"email.intro" = "The app emails you about new top jobs and problems. It sends through your own Gmail account, using a Google app you create once."
"email.google_app" = "Create a Google app once, paste its redirect address into Google Cloud, then save its client ID and secret here."
"gmail.result" = "Shows whether Gmail is connected after the Google login."
"runs.page" = "Claude cost comes from what Claude reports for each call. Runs are the tasks the scheduler or you started."
"runs.log" = "The raw log of one run. Only the end is shown if it is long."
"worker.working" = "Long jobs that run in the background. They finish by themselves. A restart stops them and they are not run again."
"worker.status" = "This job runs in the background. This page updates when it is done."

"live.dock" = "Every Claude process running now, from clicks and from daily and weekly tasks. Cancel stops it and everything waiting on it."
"settings.general.dry_run" = "While on, nothing is sent to Upwork. Leave it on until you trust the previews."
"settings.general.kill_switch" = "Stops all tasks at once. Turn it on if something looks wrong."
"settings.pay.good_spending" = "A client must have spent at least this much (USD) in total. Raise it to see only proven clients."
"settings.pay.low_rate_max" = "A job paying this rate or less counts as LOW. Change it if your market is cheaper or dearer."
"settings.pay.fit_min" = "Jobs below this fit score never reach the writing model. Lower it to get more drafts."
"settings.pay.low_rate_high_hires" = "For LOW-rate jobs, a client with this many hires or more counts as a heavy hirer."
"settings.flags.bad_review_score_max" = "A review at or below this score is a red flag on the client."
"settings.flags.bad_proposals_tier" = "Upwork's proposal-count bucket that marks a crowded job, such as 50+."
"settings.search.keywords" = "Words searched on Upwork, one per line. The setup wizard builds them from your skills."
"settings.search.recent_days_posted" = "Only jobs posted within this many days are looked at."
"settings.search.max_keywords" = "Most keyword searches in one run. Fewer searches cost less time."
"settings.ui.hide_unaffordable" = "Hides jobs that cost more Connects than your latest balance."
"settings.claude.monthly_cap_usd" = "Claude stops for the month when spend reaches this. Set it to what you can afford."
"settings.claude.cap_warn_percent" = "You see a warning when the month's spend reaches this share of the cap."
"settings.claude.retry_hours" = "Jobs still waiting for a judgement or draft are retried for this long, then dropped."
"settings.models.think" = "The model that judges jobs and plans. Change it only if a model name is retired."
"settings.models.write" = "The model that writes proposals and profile text."
"settings.models.fetch" = "A cheap model that only relays read-only Upwork calls."
"settings.safety.jss_guard" = "Set when your Job Success Score drops. It pauses profile tests until you clear it."
"settings.profile_loop.every_days" = "A new profile test starts at most this often. Longer gaps give cleaner results."
"settings.email.smtp_host" = "Optional email server for people without Gmail. Leave empty to use Gmail."
"settings.email.gmail_recipient" = "Who gets the emails. Empty means the connected Gmail address."
"settings.email.digest_skip_empty" = "No daily digest email when no good job was kept today."
"settings.security.max_login_tries" = "Wrong passwords allowed before the login locks for a while."
"settings.consolidation.skill_patches_need_approval" = "On: skill changes wait on the approvals page. Off: they apply right away."
"settings.research.enabled" = "Off means the weekly web research and its button do nothing."
"settings.approvals.expire_days" = "An item nobody decided on for this long is marked expired."
"chat.intro" = "Ask how things stand. It reads a summary and can look up a job, run or report. It cannot change anything."
"chat.readonly" = "Read-only. It never writes to Upwork, sends or approves. It has no tools, only fixed lookups. The daily cost cap is in Settings."
