"approvals.keywords_pick" = "Approve replaces the checked list with these keywords and starts the baseline."
"approvals.no_handler" = "No automatic action is attached to this kind yet. Your decision is only recorded."
"dashboard.todo" = "The newest things that wait for your click. Nothing is sent to Upwork by itself."
"dashboard.best_jobs" = "Today's best-fitting jobs, high fit first. Open one to prepare a proposal."
"dashboard.funnel" = "Proposals by the week they were sent. Viewed means the client saw it. Interviews and hires follow the proposal status."
"dashboard.rank" = "Your place in Upwork freelancer search per keyword. Lower is better; a cross means not found that day."
"dashboard.rank_table" = "Organic skips paid (boosted) results. A dash means no check yet."
"dashboard.weekly" = "A snapshot of your week from Upwork. The daily run stores one each day."
"dashboard.profile_views" = "Upwork shows no number we can read. Look at your profile stats once a week and type it here."
"dashboard.runs" = "The last run of each background task, with a Run now button for each."
"dashboard.connects" = "Connects left on your account. It is read when the daily task fetches a job."
"dashboard.cost" = "What Claude cost this month, against the monthly cap you set."
"dashboard.good_jobs" = "Jobs rated HIGH or MID that appeared since midnight."
"dashboard.waiting" = "Items in the To do list that wait for your click."
"job.fit" = "How Claude rates this job for you, with reasons and risks. Read the risks before you apply."
"job.apply" = "Prepare asks Upwork for a preview and sends nothing. Approve is the only step that can send."
"job.draft" = "Written by Claude from your USER.md facts. Edit it, then Prepare. Em dashes are flagged."
"job.questions" = "Upwork asks if you attach files and which highlights to show. Answer both before you can approve."
"review.intro" = "Paste your draft before you send it. Python checks spelling and spacing for free, then Claude checks the job's instructions, your first lines and proof. Nothing is sent to Upwork."
"review.job" = "Pick a stored job, newest first, or leave empty and paste the job text below."
"review.job_text" = "Paste the whole post, including the screening questions."
"review.answers" = "Optional. Paste each question with your answer."
"review.rate" = "For example 35 (per hour) or your fixed bid. It is compared with the job's budget."
"review.score" = "Out of 100. Above 80 is ready after a last read; fix the issues below first if it is lower."
"review.prechecks" = "Free Python checks for spelling, spacing, length and rate. Fix the red ones first."
"review.diff" = "Removed words are struck through on the left. Added words are underlined on the right."
"review.sent" = "The daily run reads your sent proposals and reviews each new one once. Nothing is changed on Upwork."
"review.history" = "Your earlier reviews, newest first. Open one to see its score and fixes."
"inbox.intro" = "Read-only. Draft reply asks Claude for a draft you copy and post by hand on Upwork. Nothing is sent from here."
"context.intro" = "Claude reads USER.md and style.md on every judging and writing run. Keep them short and true."
"context.rebuild" = "Claude drafts a short USER.md from your Upwork profile. Nothing is saved until you click Use this. It costs a few cents."
"context.user" = "Facts only: title, rate, skills, real projects with numbers, experience, languages, Upwork stats. Shorter is cheaper."
"context.style" = "How you write. Empty or unchanged text uses the default style."
"history.intro" = "A copy of your Upwork profile is saved daily and before any change, only when it changed. Roll back asks for approval first."
