# Text for the "i" icons. Plain words, short sentences. Pattern: "What it is. What to do."
"jobs.score" = "How well this job fits you, 0 to 100. Open jobs above 70 first."
"approvals.pending" = "Drafts and changes waiting for your click. Nothing is sent until you confirm."
"runs.cost" = "What Claude cost for this run. Check it if the total looks high."
"approvals.proposals" = "Proposals with a ready preview. Approve on the job page, after you see the Connects cost, boost and questions. Old previews drop off."
"approvals.keywords" = "Measures your seed keywords on Upwork, then Claude picks the best 3 to 5. Approving starts a baseline with no profile change."
"approvals.profile_test" = "One profile change at a time, tested for several days. Claude drafts it from your USER.md facts. Nothing changes on Upwork until you confirm the preview."
"approvals.small" = "Small profile changes in one click. Upwork makes a preview of each one. The preview is confirmed right away only when that setting is on."
"approvals.rollback" = "Red is on your profile now, green is the new text. Approve asks Upwork for a preview and saves a copy first. You confirm it on the History page."
"approvals.playbook" = "From the weekly web research. Approve changes the playbook only, nothing on Upwork. Web pages are untrusted, so check the sources."
"approvals.keywords_pick" = "Approve replaces the checked list with these keywords and starts the baseline."
"approvals.no_handler" = "No automatic action is attached to this kind yet. Your decision is only recorded."
"dashboard.todo" = "The newest things that wait for your click. Nothing is sent to Upwork by itself."
"dashboard.best_jobs" = "Today's best-fitting jobs, high fit first. Open one to prepare a proposal."
"dashboard.funnel" = "Proposals by the week they were sent. Viewed means the client saw it. Interviews and hires follow the proposal status."
"dashboard.rank" = "Your place in Upwork freelancer search per keyword. Lower is better; a cross means not found that day."
"dashboard.rank_table" = "Organic skips paid (boosted) results. A dash means no check yet."
"dashboard.weekly" = "A snapshot of your week from Upwork. The daily run stores one each day."
"dashboard.profile_views" = "Upwork shows no number we can read. Look at your profile stats once a week and type it here."
"dashboard.runs" = "The last run of each background task, with a Run now button for each."
"dashboard.connects" = "Connects left on your account. It is read when the daily task fetches a job."
"dashboard.cost" = "What Claude cost this month, against the monthly cap you set."
"dashboard.good_jobs" = "Jobs rated HIGH or MID that appeared since midnight."
"dashboard.waiting" = "Items in the To do list that wait for your click."
