"trends.intro" = "Counted by Python from every job the daily run saw, also dropped ones. No Claude cost. The weekly task reads these numbers."
"trends.skills" = "How often each skill appears in the jobs seen, week by week."
"trends.budget" = "Median budget per week. Fixed price and hourly are kept apart. A week with too few budgets has no point."
"trends.week" = "The last 7 days against the 7 days before, per skill."
"reports.intro" = "The weekly trend report and the monthly plan, newest first. Open one to read it."
"learning.intro" = "Each time the assistant changes its memory, playbook or skills, one entry is saved. Undo adds an entry that reverses it. It never touches Upwork."
"settings.intro" = "Every tunable value, by section. Secrets are never shown here. Email accounts live on the Email page."
"settings.dry_run" = "While on, nothing is sent to Upwork. Every write still needs a preview and your click."
"settings.kill_switch" = "Stops every scheduled task and Claude step. Turn it on if something looks wrong."
